spring:
  datasource:
    url: jdbc:h2:mem:kirotest;MODE=PostgreSQL;DATABASE_TO_UPPER=false;NON_KEYWORDS=USER
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  jwt:
    secret: test-secret-for-unit-tests-only-must-be-long-enough-1234567890
    expires-in-seconds: 3600
  cors:
    allowed-origins: http://localhost:3000
  ai-service-url: http://localhost:8000
