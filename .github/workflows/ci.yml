name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kiro
          POSTGRES_PASSWORD: kiro
          POSTGRES_DB: kiro
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U kiro -d kiro"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kiro/api prisma:generate
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm --filter @kiro/api test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r apps/ai/requirements.txt
      - run: python -m py_compile apps/ai/app/*.py
